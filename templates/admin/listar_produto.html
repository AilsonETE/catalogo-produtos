{% extends 'admin/base.html' %}

{% block content %}

<h1> Lista de Produto</h1>

<div class="col text-end">
    <a href="{{url_for('cadastrarCategoria')}}" class="btn btn-primary  ">
        Nova categoria
    </a>
</div>

<table class="table">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nome</th>
            <th scope="col">Foto</th>
            <th scope="col">Preço</th>
            <th scope="col">Ações</th>



        </tr>
    </thead>
    <tbody>

        {% for i in produtos %}
        <tr>
            <th scope="row">{{ i.id }}</th>
            <td>{{ i.nome }}</td>
            <td>{{ i.preco }}</td>

            <td><img src="data:image/jpeg;base64,
            {{ i['imagem'] }}" width="50"></td>

            <td class="text-end">
                <div class="action-btns justify-content-end">
                    <a href="{{ url_for('editarCategoria', id=i['id']) }}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil"></i>
                        <span class="d-none d-lg-inline ms-1">Editar</span>
                    </a>

                    <a href="{{ url_for('excluirCategoria', id=i['id']) }}" class="btn btn-sm btn-danger">
                        <i class="bi bi-pencil"></i>
                        <span class="d-none d-lg-inline ms-1">Excluir</span>
                    </a>
                </div>


            </td>



        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
